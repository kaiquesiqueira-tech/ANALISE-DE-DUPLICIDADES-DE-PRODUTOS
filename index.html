<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duplicidade de Cadastro</title>
<meta name="description" content="Duplicidades de cadastro do Protheus (SB1 × SBZ × SB2): faixas de similaridade, o que não bloquear, status por empresa e evolução.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/estilo.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5a6b">
<meta name="application-name" content="Duplicidade">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duplicidade">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <img class="logo" src="icones/logo.png" alt="" width="60" height="60">
      <div>
        <h1>Duplicidade de Cadastro</h1>
        <div class="meta" id="meta">Carregando a última medição…</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btnInstall" type="button" hidden title="Instalar o painel como aplicativo neste computador ou celular"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 7.5v6M9.5 11l2.5 2.5 2.5-2.5M8 21h8"/></svg>Instalar app</button>
      <button class="btn" id="btnUpload" type="button" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>Atualizar base</button>
    </div>
  </header>

  <div class="banner" id="previewBanner" hidden>
    <p><strong>Prévia da nova medição.</strong> <span id="previewText">Ainda não foi salva no histórico.</span></p>
    <div class="actions">
      <button class="btn" id="btnDiscard" type="button">Descartar</button>
      <button class="btn primary" id="btnSave" type="button">Salvar medição</button>
    </div>
  </div>

  <div class="topbar">
    <nav class="views" id="views" role="tablist" aria-label="Telas"></nav>
    <nav class="scope" id="scope" aria-label="Empresa"></nav>
  </div>

  <div id="main">
    <div class="loading" id="loading">
      <div class="eyebrow">Duplicidade de Cadastro</div>
      <div id="loadingText">Buscando a última medição salva…</div>
    </div>
  </div>
</div>

<template id="tplMain">
  <div id="v-bloq">
    <section class="fprog" id="fProg" aria-label="Andamento" hidden></section>
    <div class="ftools">
      <span class="fchips" id="fBand" role="group" aria-label="Semelhança"></span>
      <select id="fGrupo" aria-label="Grupo"></select>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="fq" placeholder="Buscar código ou descrição" aria-label="Buscar código ou descrição"></label>
      <button class="btn small" id="btnFilaXls" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>Exportar Excel</button>
    </div>
    <div id="fila"></div>
    <div class="pager" id="fPager"></div>
  </div>

  <div id="v-ind" hidden>
    <p class="ind-sub">Quanto falta bloquear em cada filial. A linha cai na hora a cada bloqueio marcado (não precisa atualizar a base) e sobe quando uma base nova traz duplicidades novas.</p>
    <div class="ind-grid" id="ind"></div>
  </div>
</template>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div id="drawerHost"></div>

<script src="js/simcore.js"></script>
<script src="js/xlsxstream.js"></script>
<script src="js/analise.js"></script>
<script src="js/xlsxwriter.js"></script>
<script src="js/armazenamento.js"></script>
<script src="js/app.js"></script>
</body>
</html>
