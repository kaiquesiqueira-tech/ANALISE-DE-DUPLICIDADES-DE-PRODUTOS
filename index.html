<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duplicidade de Cadastro</title>
<meta name="description" content="Duplicidades de cadastro do Protheus (SB1 × SBZ × SB2): faixas de similaridade, o que não bloquear, status por filial e evolução.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="eyebrow">Protheus · Almoxarifado · SB1 × SBZ × SB2</div>
      <h1>Duplicidade de Cadastro</h1>
      <div class="meta" id="meta">Carregando a última medição…</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnUpload" type="button">Atualizar base</button>
    </div>
  </header>

  <div class="banner" id="previewBanner" hidden>
    <p><strong>Prévia da nova medição.</strong> <span id="previewText">Ainda não foi salva no histórico.</span></p>
    <div class="actions">
      <button class="btn" id="btnDiscard" type="button">Descartar</button>
      <button class="btn primary" id="btnSave" type="button">Salvar medição</button>
    </div>
  </div>

  <nav class="scope" id="scope" aria-label="Escopo"></nav>

  <div id="main">
    <div class="loading" id="loading">
      <div class="eyebrow">Duplicidade de Cadastro</div>
      <div id="loadingText">Buscando a última medição salva…</div>
    </div>
  </div>
</div>

<template id="tplMain">
  <section class="kpis" id="kpis" aria-label="Indicadores"></section>

  <div class="grid2">
    <section class="panel" id="pMatrix">
      <div class="panel-h">
        <h2>Faixa de similaridade × situação</h2>
        <p>Produtos com ao menos um similar, pela maior similaridade. Clique para listar.</p>
      </div>
      <div class="mx-wrap" id="matrix"></div>
      <p class="note">“Não bloquear” considera saldo, previsão de chegada e ponto de pedido em qualquer filial da empresa — o bloqueio do cadastro (SB1) vale para a empresa inteira.</p>
    </section>
    <section class="panel" id="pEvo">
      <div class="panel-h">
        <h2>Evolução das medições</h2>
        <p id="evoSub">Produtos com similar, por faixa</p>
      </div>
      <div class="legend" id="evoLegend"></div>
      <div class="chart" id="evoChart"></div>
      <p class="note" id="evoNote"></p>
    </section>
  </div>

  <div class="grid2">
    <section class="panel">
      <div class="panel-h">
        <h2>Similaridade por filial</h2>
        <p>Produtos da filial com similar, pela maior similaridade</p>
      </div>
      <div class="legend" id="filBandLegend"></div>
      <div class="chart" id="filBandChart"></div>
    </section>
    <section class="panel">
      <div class="panel-h">
        <h2>Situação por filial</h2>
        <p>O que pode ou não ser bloqueado</p>
      </div>
      <div class="legend" id="filSitLegend"></div>
      <div class="chart" id="filSitChart"></div>
    </section>
  </div>

  <section class="panel" id="pTables">
    <div class="panel-h">
      <h2>Produtos e pares similares</h2>
      <p id="tblSub"></p>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tools" id="tools">
      <input type="search" id="q" placeholder="Buscar código ou descrição" aria-label="Buscar código ou descrição">
      <span id="bandToggles" class="tools"></span>
      <select id="fSit" aria-label="Situação"></select>
      <select id="fTipo" aria-label="Tipo de produto"></select>
      <button class="btn small" id="btnCsv" type="button" hidden>Exportar CSV</button>
    </div>
    <div class="tbl-wrap"><table class="t" id="tbl"></table></div>
    <div class="pager" id="pager"></div>
  </section>

  <section class="panel" id="pHist">
    <div class="panel-h">
      <h2>Histórico de medições</h2>
      <p>Cada atualização da base grava um ponto na evolução</p>
    </div>
    <div class="hist" id="hist"></div>
  </section>

  <details class="method">
    <summary>Como a similaridade é calculada</summary>
    <div class="body">
      <p>Comparo a descrição (B1_DESC) de cada produto ativo com todos os outros produtos da mesma empresa. Antes, tiro acentos, pontuação, zeros à esquerda e a ordem das palavras — “FILTRO P551000 DONALDSON” e “FILTRO DONALDSON P551000” ficam iguais.</p>
      <p>A similaridade é a parte em comum das duas descrições, de 0 a 100%. Quando as duas têm medidas ou códigos (palavras com números) e eles são diferentes, a similaridade cai: “BOTINA CA-42374 Nº37” e “Nº38” são produtos diferentes e não entram como duplicidade.</p>
      <p>Faixas: <strong>95–100%</strong> provável duplicidade · <strong>75–94%</strong> alta semelhança, conferir · <strong>70–74%</strong> semelhança fraca. Abaixo de 70% o par não aparece.</p>
      <p>Situação do produto: <strong>com saldo</strong> (saldo atual diferente de zero no SB2), <strong>previsão de chegada</strong> (Qtd. prevista no SB2 maior que zero), <strong>ponto de pedido</strong> (SBZ maior que zero). Qualquer um deles = não bloquear. Os demais são candidatos: “similar em uso” quando o similar tem saldo, previsão ou ponto de pedido (bloqueie este e mantenha o similar), ou “similar também livre” (escolha qual manter).</p>
      <p>Inativos: produto da SB1 com <strong>Ativo = N</strong> (ou Bloqueado = Sim, quando a coluna vier na exportação) é tratado como bloqueado. Ele sai da comparação e aparece separado na aba “Inativos (bloqueados)”. Se ainda tiver saldo, previsão de chegada ou ponto de pedido, fica marcado para conferir.</p>
      <p>Filial: o produto conta na filial quando tem registro no Saldo Físico ou na SBZ daquela filial.</p>
      <p>Onde ficam os dados: as medições publicadas estão na pasta <code>dados/</code> do repositório. Uma medição salva e ainda não enviada ao GitHub fica só no navegador de quem a gerou.</p>
    </div>
  </details>
</template>

<div class="tip" id="tip" hidden></div>
<div id="drawerHost"></div>

<script src="js/simcore.js"></script>
<script src="js/xlsxstream.js"></script>
<script src="js/analise.js"></script>
<script src="js/armazenamento.js"></script>
<script src="js/app.js"></script>
</body>
</html>
